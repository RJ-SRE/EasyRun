<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>回路遗迹 · 裂隙</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 2L30 16 16 30 2 16z' fill='%23d3bb86'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="/passages.css" />
  </head>
  <body>
    <header>
      <a href="/">裂 隙 <small>R U P T U R E</small></a
      ><span>回路遗迹 / THE TURNING PASSAGE</span>
      <nav>
        <button id="map">地图 M</button><button id="help">操作指南</button
        ><button id="sound" aria-pressed="true">声音 开</button
        ><button id="pause" disabled>暂停 Esc</button
        ><button id="full">全屏 ↗</button>
      </nav>
    </header>
    <main id="panel">
      <div id="viewport">
        <div id="stage"></div>
        <div class="vignette"></div>
        <div class="hud">
          <div>
            <small id="room-number">PASSAGE / 01</small>
            <h2 id="room-name">折叠回廊</h2>
            <p id="objective"></p>
            <div id="mechanism"></div>
          </div>
          <div class="run">
            <b id="clock">00:00</b><span id="relics">◈ 0 / 8</span
            ><small id="deaths">0 次失足</small>
          </div>
        </div>
        <div id="minimap" aria-label="关卡地图"></div>
        <div id="toast" role="status"></div>
        <div id="pull" hidden><i></i><span>拉住铜环</span></div>
        <div class="bottom">
          <span id="hint"></span><span id="checkpoint">休整灯 1 / 5</span>
        </div>
        <div id="overlay">
          <div class="title">
            <span class="eyebrow" id="kicker"
              >A CITY THAT STILL REMEMBERS HOW TO MOVE</span
            >
            <h1 id="title">回路遗迹</h1>
            <p id="body">正在唤醒墙后的机械……</p>
            <div id="difficulty">
              <button data-mode="0" class="selected">
                <b>旅人</b><small>较长机关窗口 · 从容观察</small></button
              ><button data-mode="1">
                <b>试炼</b><small>更紧凑的机关节奏</small>
              </button>
            </div>
            <button id="play" class="primary" hidden>进入遗迹 ↗</button>
            <p id="foot">五段相连的通道 · 八枚遗物 · 没有敌人的移动挑战</p>
          </div>
        </div>
        <div id="sheet" hidden>
          <div>
            <span class="eyebrow" id="sheet-kicker"></span>
            <h2 id="sheet-title"></h2>
            <div id="sheet-content"></div>
            <button id="close-sheet" class="primary">返回旅程 ↗</button>
          </div>
        </div>
      </div>
      <footer>
        <span id="status">下潜、横渡、攀升。让整座建筑成为你的路线。</span
        ><span id="best">本机纪录 —</span>
      </footer>
    </main>
    <div class="controls">
      <span><kbd>A D</kbd> 移动</span><span><kbd>SPACE</kbd> 二段跳 / 蹬墙</span
      ><span><kbd>E</kbd> 钩索 / 拉住机关</span><span><kbd>K</kbd> 冲刺</span
      ><span><kbd>S SPACE</kbd> 下穿</span><span><kbd>R</kbd> 重开</span>
    </div>
    <p class="mobile">此关卡使用电脑键盘操作。</p>
    <script type="module" src="/passages.js"></script>
  </body>
</html>
